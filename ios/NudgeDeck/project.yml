name: NudgeDeck
options:
  bundleIdPrefix: com.jamesshah
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Without this, xcodebuild would pick AppStore (first alphabetically).
  defaultConfig: Debug

packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # libconvexmobile-rs ships no x86_64 Simulator slice.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

# Debug / Release → Config/App.xcconfig (staging Convex; TestFlight archives use Release).
# AppStore → Config/Production.xcconfig (App Store; archive via the NudgeDeckAppStore scheme).
configs:
  Debug: debug
  Release: release
  AppStore: release

targets:
  NudgeDeck:
    type: application
    platform: iOS
    sources:
      - path: NudgeDeck
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
      AppStore: Config/Production.xcconfig
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Nudge Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CONVEX_URL: $(CONVEX_URL)
        ENABLE_DEV_SIGNIN: $(ENABLE_DEV_SIGNIN)
        # HTTPS-only (TLS) is exempt. This skips App Store Connect's Missing
        # Compliance gate so Xcode Cloud can finish TestFlight Internal Testing.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        NSMicrophoneUsageDescription: Record a voice note as proof you completed a card.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesshah.nudgedeck
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Support/NudgeDeck.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
        AppStore:
          APS_ENVIRONMENT: production
    dependencies:
      - package: ConvexMobile
        product: ConvexMobile
    scheme:
      testTargets:
        - NudgeDeckTests

  NudgeDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NudgeDeckTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesshah.nudgedeck.tests
    dependencies:
      - target: NudgeDeck

  NudgeDeckSmokeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NudgeDeckSmokeUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesshah.nudgedeck.smokeuitests
        TEST_TARGET_NAME: NudgeDeck
    dependencies:
      - target: NudgeDeck

schemes:
  NudgeDeckAppStore:
    build:
      targets:
        NudgeDeck: all
    run:
      config: AppStore
    test:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
  NudgeDeckSmoke:
    build:
      targets:
        NudgeDeck: all
        NudgeDeckSmokeUITests: [test]
    test:
      targets:
        - NudgeDeckSmokeUITests
